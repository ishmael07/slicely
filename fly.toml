app = "slicely"            # owner renames
primary_region = "iad"
[build]
  [build.args]
    SOURCE_COMMIT = "set by deploy script"
[env]
  SLICELY_MODE = "hosted"
  SLICELY_WORKDIR = "/data"
  SLICELY_TRUST_PROXY = "1"
  SLICELY_PORT = "8080"
  SLICELY_MAX_SLICES = "2"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # sessions are in memory
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"
[mounts]
  source = "slicely_data"
  destination = "/data"
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
